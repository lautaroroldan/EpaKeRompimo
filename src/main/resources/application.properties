spring.application.name=epakerompimo

# Load local secrets from an optional .env file (dev convenience).
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# External APIs
# ---------------------------------------------------------------------------
# RAWG API key. Never commit the real value; provide it via environment
# variable (or a local profile). See .env.example.
rawg.api.key=${RAWG_API_KEY:}

# ---------------------------------------------------------------------------
# HTTP client (applies to the auto-configured RestClient.Builder)
# ---------------------------------------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
