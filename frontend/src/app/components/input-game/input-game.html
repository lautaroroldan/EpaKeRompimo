<div class="relative flex w-full flex-col gap-2">
    <input type="text" hlmInput [value]="input" (input)="onInputChange($event)" (keydown.escape)="onEscape()"
        placeholder="Buscá un juego..." aria-label="Buscar un juego" autocomplete="off" class="border-b" />

    @if (open()) {
    <ul
        class="absolute top-full left-0 right-0 z-50 mt-1 max-h-96 w-full overflow-y-auto rounded-lg border border-border bg-popover p-2 text-popover-foreground shadow-lg">
        @if (games().length > 0) {
        @for (game of games(); track game.game.id) {
        <li>
            <button type="button" (click)="select(game.game.title)"
                class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-xl border-b border-border p-2 text-left hover:bg-accent hover:text-accent-foreground hover:outline-2">
                <span class="flex min-w-0 items-center gap-2">
                    <img [src]="game.game.imageUrl ?? 'https://static.vecteezy.com/system/resources/thumbnails/022/059/000/small_2x/no-image-available-icon-vector.jpg'"
                        alt="" class="h-11 w-24 shrink-0 rounded-md object-cover" />
                    <span class="line-clamp-2">{{ game.game.title }}</span>
                </span>
                @if (game.prices[0]; as price) {
                @if (price.salePrice === 0) {
                <span class="shrink-0 text-sm">Gratis</span>
                } @else if (price.salePrice != null) {
                <span class="shrink-0 text-sm">{{ formatPrice(price.salePrice, price.currency) }}</span>
                } @else {
                <span class="shrink-0 text-sm text-muted-foreground">sin precio</span>
                }
                } @else {
                <span class="shrink-0 text-sm text-muted-foreground">sin precio</span>
                }
            </button>
        </li>
        }
        } @else if (loading()) {
        <li class="p-2 text-muted-foreground">Buscando...</li>
        } @else {
        <li class="p-2 text-muted-foreground">No encontramos juegos con ese nombre.</li>
        }
    </ul>
    }
</div>
