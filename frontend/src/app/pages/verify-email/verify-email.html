<section class="mx-auto w-full max-w-md p-6">
    <h1 class="mb-4 text-2xl font-semibold">Verificación de mail</h1>

    @switch (status()) {
    @case ('loading') {
    <p class="text-sm text-muted-foreground">Verificando tu mail…</p>
    }
    @case ('ok') {
    <p class="mb-4 text-sm" role="status">¡Listo! Tu mail quedó verificado.</p>
    <a [routerLink]="isLoggedIn() ? '/cuenta' : '/login'"
        class="inline-flex h-9 items-center justify-center rounded-lg bg-primary px-4 text-sm font-medium text-primary-foreground">
        {{ isLoggedIn() ? 'Ir a mi cuenta' : 'Ingresar' }}
    </a>
    }
    @default {
    <p class="mb-2 text-sm text-destructive" role="alert">{{ error() }}</p>
    <p class="mb-4 text-sm text-muted-foreground">Podés pedir un mail nuevo desde "Mi cuenta".</p>
    <a routerLink="/cuenta"
        class="inline-flex h-9 items-center justify-center rounded-lg border border-input px-4 text-sm hover:bg-accent">
        Ir a mi cuenta
    </a>
    }
    }
</section>
