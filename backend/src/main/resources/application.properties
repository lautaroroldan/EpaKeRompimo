spring.application.name=epakerompimo

# Load local secrets from an optional .env file (dev convenience).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# External APIs
# ---------------------------------------------------------------------------
# IGDB credentials (a Twitch developer app with Client Type = Confidential).
# Never commit the real values; provide them via environment variables or a
# local .env file. See .env.example.
igdb.client.id=${IGDB_CLIENT_ID:}
igdb.client.secret=${IGDB_CLIENT_SECRET:}
itad.api.key=${ITAD_API_KEY:}
itad.client.id=${ITAD_CLIENT_ID:}
itad.client.secret=${ITAD_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# HTTP client (applies to the auto-configured RestClient.Builder)
# ---------------------------------------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

jwt.secret=${JWT_SECRET:}

# Configuración del controlador para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto de Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
