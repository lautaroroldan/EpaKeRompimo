spring.application.name=epakerompimo

# Load local secrets from an optional .env file (dev convenience).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# External APIs
# ---------------------------------------------------------------------------
# IGDB credentials (a Twitch developer app with Client Type = Confidential).
# Never commit the real values; provide them via environment variables or a
# local .env file. See .env.example.
igdb.client.id=${IGDB_CLIENT_ID:}
igdb.client.secret=${IGDB_CLIENT_SECRET:}
itad.api.key=${ITAD_API_KEY:}
itad.client.id=${ITAD_CLIENT_ID:}
itad.client.secret=${ITAD_CLIENT_SECRET:}

# Country used to quote prices when the client does not send one (ISO 3166-1
# alpha-2). ITAD returns prices in that country's currency.
itad.country=${ITAD_COUNTRY:US}

# ---------------------------------------------------------------------------
# HTTP client (applies to the auto-configured RestClient.Builder)
# ---------------------------------------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# Defaults to a local, file-based H2 database so the app runs with zero setup.
# To switch to MySQL, set DB_URL / DB_USERNAME / DB_PASSWORD (e.g. in
# backend/.env). The JDBC driver and Hibernate dialect are auto-detected from
# the URL, so no other change is needed:
#   DB_URL=jdbc:mysql://localhost:3306/epakerompimo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/epakerompimo;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dev-only JWT secret (Base64, >= 32 bytes). MUST be overridden in production
# via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:KOksQyTkas8haWEfdieLj9vM7XG30t1cijBPNHr4rYmhBPSW+2VocnzdiR6ry/LkQevjOPDNXr5YSLCHnYrtnA==}

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Mail (Gmail). Usuario y contraseña de aplicación vienen de variables de entorno
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_EMPRESA:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del front, se usa para armar el link del mail de confirmación
app.frontend-url=http://localhost:4200